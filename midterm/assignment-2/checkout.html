<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Minimalist</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/images/minimalist-logo.png">
</head>
<body>
  <header class="site-header">
    <div class="site-container checkout-header">
      <a class="navbar-brand" href="index.html" aria-label="Minimalist home"><img class="brand-logo" src="assets/images/minimalist-logo.png" alt="Minimalist" width="562" height="96"></a>
      <a href="index.html#catalogue">Continue shopping</a>
    </div>
  </header>
  <main class="site-container checkout-page">
    <h1>Checkout</h1>
    <form action="index.html" method="get">
      <div class="checkout-fields">
        <fieldset>
          <legend>Contact</legend>
          <div class="form-field"><label for="full-name">Full name</label><input id="full-name" name="full-name" type="text" autocomplete="name" required minlength="3"><span class="field-message">Please enter your full name.</span></div>
          <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><span class="field-message">Please enter a valid email address.</span></div>
          <div class="form-field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" inputmode="tel" pattern="03[0-9]{2}-[0-9]{7}" placeholder="03XX-XXXXXXX" title="Format: 03XX-XXXXXXX" required><span class="field-message">Use the format 03XX-XXXXXXX.</span></div>
        </fieldset>
        <fieldset>
          <legend>Delivery</legend>
          <div class="form-field"><label for="address">Address</label><input id="address" name="address" type="text" autocomplete="street-address" required minlength="8"><span class="field-message">Please enter your delivery address.</span></div>
          <div class="form-field"><label for="city">City</label><select id="city" name="city" required><option value="">Choose a city</option><option>Islamabad</option><option>Lahore</option><option>Karachi</option><option>Rawalpindi</option><option>Peshawar</option></select><span class="field-message">Please choose a city.</span></div>
          <div class="form-field"><label for="delivery-date">Delivery date</label><input id="delivery-date" name="delivery-date" type="date" min="2026-10-29" max="2026-12-05" required><span class="field-message">Choose a date between 29 October and 5 December 2026.</span></div>
        </fieldset>
      </div>
      <button class="btn btn-dark checkout-submit" type="submit">Place order</button>
    </form>
  </main>
</body>
</html>
